name: mobile

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      # Les tests d'intégration exigent un backend démarré : ils sont exclus ici.
      - name: Tests unitaires
        run: flutter test --exclude-tags integration

      - name: Vérifier que l'app compile
        run: flutter build web --no-tree-shake-icons --no-wasm-dry-run
