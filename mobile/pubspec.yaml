name: lamssa
description: LAMSSA — Application de réservation de salons & beauté — Tunisie
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Directions RTL et formats de date/nombre par locale (§2.5)
  flutter_localizations:
    sdk: flutter

  # Maps
  google_maps_flutter: ^2.5.3

  # Fonts
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Firebase — notifications push (§3.7)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # API
  http: ^1.2.1
  http_parser: ^4.0.2   # MediaType pour l'upload multipart (Style DNA)
  shared_preferences: ^2.2.3

  # Reels (§3.8) — lecture vidéo et sélection depuis la galerie
  video_player: ^2.9.2
  chewie: ^1.8.5

  # UI Components
  qr_flutter: ^4.1.0        # QR du salon — pur Dart, aucune dépendance native
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  lottie: ^2.7.0

  # Utils
  intl: ^0.20.2   # version imposée par flutter_localizations
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  path_provider: ^2.1.2   # fichier temporaire du QR partagé en image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Navigation
  go_router: ^13.2.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080810"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
